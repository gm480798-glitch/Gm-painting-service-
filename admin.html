@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--cd:#141d2e;--tx:#e6edf7;--mu:#93a4bb;--ln:#2a3850;--fd:#1b2a42;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0b1220;--cd:#141d2e;--tx:#e6edf7;--mu:#93a4bb;--ln:#2a3850;--fd:#1b2a42;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
.w{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:6px 0}h2{font-size:15px;margin:14px 0 6px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:8px 0}
input,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--fd);border:1px solid var(--ln);border-radius:8px;padding:11px;min-height:44px}
textarea{min-height:64px;resize:vertical}label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;min-height:44px;background:var(--or);color:#fff;font-weight:600}
button.s{background:var(--fd);color:var(--tx);border:1px solid var(--ln)}button.r{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.b{display:grid;gap:8px;margin-top:10px}.rw{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:13px}.pill{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--ln);white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.chips button{padding:7px 12px;min-height:36px;white-space:nowrap}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));border-radius:99px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.bad{color:var(--bad)}.ok{color:var(--ok)}.tt{display:flex;justify-content:space-between;padding:4px 0}.big{font-size:18px;font-weight:700}
.bn{background:var(--or);color:#fff;padding:8px 12px;border-radius:8px;margin:8px 0;font-size:13px}

function pre(k){return PRESETS.find(function(p){return p.k===k})}

 var b=Math.max(s-n(j.disc),0),g=Math.round(b*n(j.gst))/100,t=Math.round((b+g)*100)/100,p=(j.pays||[]).reduce(function(a,x){return a+n(x.amt)},0);
 return{s:s,g:g,t:t,paid:p,bal:Math.round((t-p)*100)/100}}
function words(x){var a="One Two Three Four Five Six Seven Eight Nine Ten Eleven Twelve Thirteen Fourteen Fifteen Sixteen Seventeen Eighteen Nineteen".split(" "),b="  Twenty Thirty Forty Fifty Sixty Seventy Eighty Ninety".split(" ");
 function t2(k){return k<20?a[k-1]:b[Math.floor(k/10)]+(k%10?" "+a[k%10-1]:"")}

 var r=Math.round(x),p=[],c=Math.floor(r/1e7),l=Math.floor(r%1e7/1e5),h=Math.floor(r%1e5/1e3),u=r%1e3;
 if(c)p.push(t3(c)+" Crore");if(l)p.push(t2(l)+" Lakh");if(h)p.push(t2(h)+" Thousand");if(u)p.push(t3(u));
